[package]
name = "frx"
version = "0.3.0"
description = "FRX — Play. Fix. Repeat. Gerenciador de compatibilidade e otimização de jogos no Linux."
authors = ["FRX"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.85"

[lib]
# O sufixo evita conflito de nomes entre a lib e o binário no Cargo.
name = "frx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2.5.5"
tokio = { version = "1.53.3", features = ["time", "sync", "macros", "rt"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "system-proxy"] }
tauri-plugin-dialog = "2.7.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
