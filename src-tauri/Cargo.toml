[package]
name = "frx"
version = "0.5.0"
description = "Hardware Fixer — diagnóstico e correções de hardware para laptops Linux, com prévia, backup e desfazer."
authors = ["Gustavo Maquias"]
license = "MIT"
repository = "https://github.com/gustavomfg/FRX"
edition = "2021"
rust-version = "1.88"

[lib]
# O sufixo evita conflito de nomes entre a lib e o binário no Cargo.
name = "frx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2.5.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "system-proxy"] }
sha2 = "0.11.0"
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
